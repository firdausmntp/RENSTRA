name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -count=1 ./...
      - name: Run go vet
        run: go vet ./...
      - name: Cross-compile linux/amd64 and linux/arm64 (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/renstra-amd64 ./cmd/renstra
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/renstra-arm64 ./cmd/renstra
