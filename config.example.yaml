# RENSTRA example configuration
# Salin ke $RENSTRA_HOME/config.yaml (izin 0600) atau jalankan `renstra setup`.

default_model: "utama:gpt-4o-mini"

# Provider cadangan bila provider utama gagal / rate-limited
fallbacks:
  - "cadangan:claude-sonnet-4-5"

providers:
  utama:
    kind: "openai" # openai | anthropic | custom
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    default_model: "gpt-4o-mini"
    timeout: 120s
    # path: "/chat/completions"
    # proxy: "http://127.0.0.1:8080"
    # headers:
    #   X-Custom-Header: "value"
    models:
      gpt-4o-mini:
        context: 128000
        max_output: 4096
        price_in: 0.15
        price_out: 0.60

  cadangan:
    kind: "anthropic"
    base_url: "https://api.anthropic.com"
    api_key_env: "ANTHROPIC_API_KEY"
    default_model: "claude-sonnet-4-5"
    timeout: 120s
    models:
      claude-sonnet-4-5:
        context: 200000
        max_output: 8192
        price_in: 3.00
        price_out: 15.00

aliases:
  cepat: "utama:gpt-4o-mini"
  sonnet: "cadangan:claude-sonnet-4-5"

# --- Approval ---
# mode: prompt = tanya lewat inline keyboard Telegram / y/N CLI
#       auto   = izinkan semua tool berbahaya
#       deny   = tolak semua tool berbahaya
approval:
  mode: "prompt"
  timeout: 120s
  always_allowed:
    - "terminal:git status"
    - "terminal:ls"
  always_denied:
    - "terminal:rm -rf"

# --- Telegram ---
telegram:
  token: "123456:ABC-DEF-YOUR-BOT-TOKEN"
  allowed_users:
    - 123456789 # Ganti dengan Telegram User ID kamu (kosong = tolak semua)
  poll_timeout: 30s

# --- Agent ---
agent:
  system_prompt_prefix: "kamu adalah asisten teknis yang ringkas, jujur, dan langsung menyelesaikan pekerjaan"
  max_iterations: 40
  max_turn_timeout: 15m
  aux_model: "gpt-4o-mini"
  auto_compact: true
  compact_threshold: 0.7

# --- Tools ---
tools:
  terminal: true
  read_file: true
  write_file: true
  patch: true
  web_fetch: true
  web_search: true
  memory: true
  skill: true
  cron: true
  delegate: true
  session_search: true

# --- Limits (0 = nonaktif, hanya peringatan harian) ---
limits:
  warn_daily_usd: 1.0
  max_daily_usd: 0
  max_daily_tokens: 0
