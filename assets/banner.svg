<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <clipPath id="card">
      <rect x="2" y="2" width="1196" height="276" rx="16"/>
    </clipPath>
  </defs>

  <!-- Clean dark canvas, no decorative clutter -->
  <g clip-path="url(#card)">
    <rect x="2" y="2" width="1196" height="276" fill="#090D16"/>
    <!-- Subtle top hairline highlight -->
    <line x1="2" y1="3" x2="1198" y2="3" stroke="#1E293B" stroke-width="1"/>
  </g>
  <rect x="2" y="2" width="1196" height="276" rx="16" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Monogram mark (no nested double-box) -->
  <g transform="translate(88, 76)">
    <rect width="128" height="128" rx="26" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <path fill-rule="evenodd" clip-rule="evenodd"
      d="M38 34H72C83.0457 34 92 42.9543 92 54C92 65.0457 83.0457 74 72 74H52V94H38V34ZM52 46V62H71C75.4183 62 79 58.4183 79 54C79 49.5817 75.4183 46 71 46H52Z"
      fill="#F8FAFC"/>
    <path d="M58 74H75L92 94H74L58 74Z" fill="#38BDF8"/>
  </g>

  <!-- Tight editorial typography -->
  <text x="256" y="128" fill="#F8FAFC"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="56" font-weight="700" letter-spacing="-1.5">renstra</text>

  <text x="258" y="168" fill="#94A3B8"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="21" font-weight="400">Self-hosted Telegram-first AI agent in pure Go.</text>

  <!-- Plain typographic metadata (no pill boxes) -->
  <text x="258" y="204" fill="#64748B"
    font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="14" font-weight="500" letter-spacing="0.4">
    <tspan fill="#38BDF8">zero-cgo</tspan>
    <tspan dx="12">·</tspan>
    <tspan dx="12">single binary</tspan>
    <tspan dx="12">·</tspan>
    <tspan dx="12">sqlite wal</tspan>
    <tspan dx="12">·</tspan>
    <tspan dx="12">mcp &amp; cron</tspan>
  </text>
</svg>
