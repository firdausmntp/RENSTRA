# RENSTRA example MCP configuration
# Salin ke $RENSTRA_HOME/mcp.yaml (atau <UserConfigDir>/renstra/global/mcp.yaml).

servers:
  filesystem:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/srv/projects"
    env:
      - "NODE_ENV=production"

